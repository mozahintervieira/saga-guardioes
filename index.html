<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saga Guardiões - 6º Ano | SEDU-ES</title>
  <style>
    :root {
      --forest-950: #0b271c; --forest-900: #143d2b; --forest-700: #236347;
      --cream: #fff8e8; --paper: #fffdf7; --ink: #17352a; --muted: #52675f;
      --ochre: #d88b28; --gold: #f6c453; --indigo: #315a8a; --terracotta: #b95038;
      --success: #197345; --error: #a52d25; --line: #d9dccd;
      --shadow: 0 14px 40px rgba(20, 61, 43, .15);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--cream); font-family: system-ui, -apple-system, sans-serif; line-height: 1.55; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: .65rem 2rem; color: #fff; background: var(--forest-950); border-bottom: 4px solid var(--ochre); }
    .brand { display: flex; align-items: center; gap: .7rem; color: inherit; text-decoration: none; font-weight: bold; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; color: var(--forest-950); background: var(--gold); border-radius: 8px; }
    .status { display: flex; gap: .75rem; font-size: .85rem; }
    .status span { padding: .4rem .7rem; background: rgba(255,255,255,.1); border-radius: 999px; }
    .screen { display: none; padding: 2rem; max-width: 1000px; margin: 0 auto; }
    .screen.active { display: block; }
    .hero-screen { text-align: center; padding-top: 4rem; }
    h1 { font-size: 2.8rem; color: var(--forest-950); margin-bottom: .5rem; }
    .lead { color: var(--muted); font-size: 1.2rem; max-width: 600px; margin: 0 auto 2rem; }
    #playerName { width: 100%; max-width: 400px; padding: .8rem 1rem; border: 2px solid #98a89f; border-radius: 12px; font-size: 1rem; margin-bottom: 1rem; }
    .primary-button { color: #fff; background: var(--forest-700); border: none; padding: .8rem 1.6rem; border-radius: 12px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 0 var(--forest-950); }
    .primary-button:hover { transform: translateY(-2px); }
    .phase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .phase-card { padding: 1.5rem; background: var(--paper); border: 2px solid var(--line); border-top: 6px solid var(--phase-color); border-radius: 16px; text-align: left; }
    .phase-card h3 { margin: .5rem 0 .2rem; }
    .challenge-shell { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; margin-top: 1rem; }
    .phase-brief { padding: 1.2rem; color: #fff; background: var(--forest-900); border-radius: 16px; }
    .challenge-main { padding: 1.5rem; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); }
    .context-box { padding: 1rem; background: #eef4e9; border-left: 5px solid var(--forest-700); border-radius: 8px; margin-bottom: 1.5rem; }
    .options { display: grid; gap: .75rem; margin-top: 1rem; }
    .option { display: flex; align-items: center; gap: .8rem; padding: 1rem; background: #fff; border: 2px solid #c8d2cb; border-radius: 12px; text-align: left; width: 100%; }
    .option.selected { border-color: var(--indigo); background: #e8f2fb; }
    .feedback { margin-top: 1rem; padding: 1rem; border-radius: 8px; }
    .feedback.success { background: #e3f5e9; color: var(--success); }
    .feedback.error { background: #fff0ec; color: var(--error); }
    @media(max-width: 768px) { .challenge-shell { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="#" class="brand" onclick="showScreen('startScreen')">
      <div class="brand-mark">G</div>
      <span>Saga Guardiões · 6º Ano</span>
    </a>
    <div class="status">
      <span>Pontos: <strong id="scoreStatus">0</strong></span>
      <span>Fases: <strong id="medalStatus">0/6</strong></span>
    </div>
  </header>

  <main>
    <!-- Tela Inicial -->
    <section class="screen active" id="startScreen">
      <div class="hero-screen">
        <h1>Saga Guardiões</h1>
        <p class="lead">Aventura pedagógica interdisciplinar alinhada ao Currículo SEDU/ES.</p>
        <input type="text" id="playerName" placeholder="Digite seu nome para jogar" maxlength="30"><br>
        <button class="primary-button" onclick="startGame()">Iniciar Jornada →</button>
      </div>
    </section>

    <!-- Mapa -->
    <section class="screen" id="mapScreen">
      <h2>Mapa de Missões</h2>
      <p id="progressText">0 de 6 fases concluídas</p>
      <div class="phase-grid" id="phaseGrid"></div>
    </section>

    <!-- Jogo -->
    <section class="screen" id="challengeScreen">
      <button onclick="showScreen('mapScreen')" style="margin-bottom: 1rem;">← Voltar ao Mapa</button>
      <div class="challenge-shell">
        <aside class="phase-brief" id="phaseBrief"></aside>
        <div class="challenge-main">
          <div id="challengeContent"></div>
          <div class="feedback" id="feedback" hidden></div>
          <div style="margin-top: 1.5rem; text-align: right;" id="actionArea">
            <button class="primary-button" onclick="checkAnswer()">Confirmar Resposta</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Final -->
    <section class="screen" id="finalScreen">
      <div style="text-align: center; padding: 2rem;">
        <h2>🎉 Parabéns, Guardião!</h2>
        <p>Você completou todas as missões com sucesso!</p>
        <div style="border: 4px solid var(--gold); padding: 2rem; background: #fff; border-radius: 12px; max-width: 500px; margin: 2rem auto;">
          <small>CERTIFICADO DE CONCLUSÃO</small>
          <h3 id="certName" style="font-size: 2rem; margin: .5rem 0;"></h3>
          <p>Pontuação Final: <strong id="certScore">0</strong> pontos</p>
        </div>
        <button class="primary-button" onclick="location.reload()">Jogar Novamente</button>
      </div>
    </section>
  </main>

  <script>
    const PHASES = [
      { id:'lp', title:'Vozes do Território', subject:'Língua Portuguesa', color:'#315a8a', skill:'EF69LP03', context:'REPORTAGEM: Em 2026, foram destinados R$ 53 milhões para rede de água em Dourados (MS), beneficiando 20 mil indígenas.', q:'Qual é o fato central da reportagem?', opts:['Recursos destinados para expansão de água.','Obras totalmente concluídas.','Problema de energia elétrica.','Preferência por grandes construções.'], correct:0, exp:'O fato central é o anúncio dos recursos para abastecimento de água.' },
      { id:'his', title:'Rotas de Mali', subject:'História', color:'#b95038', skill:'EF06HI14/ES', context:'No século XIV, Tombuctu reunia comércio de sal, ouro, livros e conhecimento entre rotas do Saara.', q:'O que essas redes demonstram?', opts:['Isolamento da região africana.','Mali participava de redes econômicas e culturais amplas.','Ausência de centros urbanos.','Apenas trocas locais sem impacto.'], correct:1, exp:'Mali era um polo articulado de comércio, cultura e saberes.' },
      { id:'cie', title:'Rede do Cuidado', subject:'Ciências', color:'#d88b28', skill:'EF06CI10/ES', context:'Substâncias depressoras diminuem a atividade do sistema nervoso central.', q:'Qual efeito caracteriza essa categoria?', opts:['Aumento extremo do estado de alerta.','Redução de reflexos e respostas mais lentas.','Alterações visuais intensas.','Sem impacto no organismo.'], correct:1, exp:'Substâncias depressoras reduzem a velocidade da resposta nervosa.' },
      { id:'geo', title:'Guardiões da Nascente', subject:'Geografia', color:'#23769f', skill:'EF06GE11/ES', context:'A vegetação ciliar protege o solo da erosão e garante a infiltração de água da chuva.', q:'Qual ação favorece a proteção de uma nascente?', opts:['Retirar toda a cobertura vegetal.','Replantar espécies nativas na margem.','Asfaltar o entorno do rio.','Permitir pisoteio constante.'], correct:1, exp:'Plantas nativas retêm o solo e protegem a nascente.' },
      { id:'mat', title:'Mapa em Escala', subject:'Matemática', color:'#6f4a8e', skill:'EF06MA21', context:'Uma área de 4x3 quadrados na malha quadriculada será ampliada com fator 2.', q:'Quais serão as novas medidas?', opts:['6 x 5','8 x 6','8 x 3','4 x 6'], correct:1, exp:'Multiplica-se ambas as dimensões por 2: 4x2=8 e 3x2=6.' },
      { id:'comp', title:'Rega Inteligente', subject:'Computação', color:'#347563', skill:'EF06CO02', context:'O sensor indica "solo úmido". O programa diz: SE solo seco, ENTÃO irrigar.', q:'Qual instrução o algoritmo executará?', opts:['Irrigar por 5 minutos.','Avançar sem irrigar.','Desligar o sistema.','Reiniciar a leitura.'], correct:1, exp:'Como a condição "seco" é falsa, o algoritmo economiza água e avança.' }
    ];

    let state = { player: '', score: 0, current: 0, completed: [], selected: null };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startGame() {
      state.player = document.getElementById('playerName').value.trim() || 'Guardião';
      renderMap();
      showScreen('mapScreen');
    }

    function renderMap() {
      const grid = document.getElementById('phaseGrid');
      grid.innerHTML = PHASES.map((p, i) => {
        const done = state.completed.includes(i);
        const unlocked = i === 0 || state.completed.includes(i - 1);
        return `
          <div class="phase-card" style="--phase-color:${p.color}">
            <small>FASE ${i+1}</small>
            <h3>${p.title}</h3>
            <p><strong>${p.subject}</strong> (${p.skill})</p>
            <button class="primary-button" style="margin-top:1rem; width:100%" ${unlocked ? '' : 'disabled'} onclick="playPhase(${i})">
              ${done ? '✓ Refazer' : unlocked ? 'Jogar →' : '🔒 Bloqueado'}
            </button>
          </div>
        `;
      }).join('');
      document.getElementById('progressText').textContent = `${state.completed.length} de 6 fases concluídas`;
      document.getElementById('scoreStatus').textContent = state.score;
      document.getElementById('medalStatus').textContent = `${state.completed.length}/6`;
    }

    function playPhase(idx) {
      state.current = idx;
      state.selected = null;
      const p = PHASES[idx];
      document.getElementById('phaseBrief').innerHTML = `
        <h2>${p.title}</h2>
        <p><strong>${p.subject}</strong></p>
        <small>Habilidade: ${p.skill}</small>
      `;
      document.getElementById('challengeContent').innerHTML = `
        <div class="context-box">${p.context}</div>
        <h3>${p.q}</h3>
        <div class="options">
          ${p.opts.map((opt, i) => `
            <button class="option" onclick="selectOpt(${i}, this)">
              <strong>${String.fromCharCode(65+i)}</strong>. ${opt}
            </button>
          `).join('')}
        </div>
      `;
      document.getElementById('feedback').hidden = true;
      document.getElementById('actionArea').innerHTML = `<button class="primary-button" onclick="checkAnswer()">Confirmar Resposta</button>`;
      showScreen('challengeScreen');
    }

    function selectOpt(i, btn) {
      state.selected = i;
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function checkAnswer() {
      if (state.selected === null) return alert('Selecione uma opção!');
      const p = PHASES[state.current];
      const fb = document.getElementById('feedback');
      fb.hidden = false;

      if (state.selected === p.correct) {
        fb.className = 'feedback success';
        fb.innerHTML = `<strong>Correto!</strong><p>${p.exp}</p>`;
        if (!state.completed.includes(state.current)) {
          state.score += 100;
          state.completed.push(state.current);
        }
        document.getElementById('actionArea').innerHTML = `<button class="primary-button" onclick="nextStep()">Avançar →</button>`;
      } else {
        fb.className = 'feedback error';
        fb.innerHTML = `<strong>Ainda não.</strong><p>${p.exp}</p>`;
      }
    }

    function nextStep() {
      if (state.completed.length === PHASES.length) {
        document.getElementById('certName').textContent = state.player;
        document.getElementById('certScore').textContent = state.score;
        showScreen('finalScreen');
      } else {
        renderMap();
        showScreen('mapScreen');
      }
    }
  </script>
</body>
</html>
